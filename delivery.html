<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Delivery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#FAF6EC;
    --paper-dim:#F1EADA;
    --ink:#211F1B;
    --ink-soft:#5B564C;
    --bg:#181714;
    --stamp:#B4392C;
    --sage:#6E7A56;
    --line:#D8CFBB;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:120px;
  }
  .wrap{ max-width:640px; margin:0 auto; padding:0 16px; }

  /* HERO: logo + carimbo do restaurante */
  .hero{
    padding:44px 16px 30px;
    text-align:center;
    color:var(--paper);
  }
  .hero-logo-frame{
    width:78px; height:78px;
    border-radius:20px;
    background:var(--paper);
    display:flex; align-items:center; justify-content:center;
    padding:10px;
    margin:0 auto 20px;
    box-shadow:0 10px 26px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.06);
  }
  .hero-logo-frame img{
    width:100%; height:100%; object-fit:contain;
  }
  .track-logo-frame{
    width:56px; height:56px;
    border-radius:16px;
    background:var(--paper);
    display:flex; align-items:center; justify-content:center;
    padding:8px;
    margin:0 auto 16px;
    box-shadow:0 8px 20px rgba(0,0,0,0.4);
  }
  .track-logo-frame img{ width:100%; height:100%; object-fit:contain; }
  .stamp{
    display:inline-block;
    border:3px solid var(--paper);
    border-radius:6px;
    padding:14px 26px;
    transform:rotate(-3deg);
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:28px;
    letter-spacing:0.5px;
  }
  .hero .mesa-tag{
    margin-top:20px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:3px;
    color:#8A8474;
  }
  .hero .mesa-num{
    color:var(--paper);
    font-weight:600;
  }

  /* CATEGORIAS - tabs */
  .cat-tabs{
    display:flex; gap:9px; overflow-x:auto;
    padding:6px 16px 20px;
    scrollbar-width:none;
  }
  .cat-tabs::-webkit-scrollbar{display:none;}
  .cat-tab{
    flex:0 0 auto;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.8px;
    text-transform:uppercase;
    color:#B8B2A2;
    border:1px solid #37352C;
    background:#1C1B17;
    padding:9px 16px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
    transition:all 0.15s ease;
  }
  .cat-tab.active{
    background:var(--sage);
    border-color:var(--sage);
    color:var(--paper);
    box-shadow:0 3px 10px rgba(110,122,86,0.4);
  }

  /* CARD DO CARDAPIO - papel */
  .paper-panel{
    background:var(--paper);
    border-radius:22px 22px 0 0;
    padding:8px 0 24px;
    box-shadow:0 -8px 24px rgba(0,0,0,0.25);
  }
  .cat-section{ padding:26px 20px 12px; }
  .cat-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:22px;
    margin-bottom:2px;
  }
  .cat-subtitle{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:1px;
    text-transform:uppercase;
  }
  .cat-divider{
    border:none;
    border-top:2px dashed var(--line);
    margin:12px 0 4px;
  }

  .produtos-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:14px;
    padding:6px 16px 8px;
  }

  .produto-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    display:flex;
    box-shadow:0 2px 10px rgba(33,31,27,0.05);
  }
  .produto-card.sem-imagem{ background:var(--paper); }

  .produto-img-wrap{
    flex:0 0 112px;
    position:relative;
    background:var(--paper-dim);
  }
  .produto-img{
    width:112px; height:100%; min-height:112px;
    object-fit:cover; display:block;
  }
  .produto-img-placeholder{
    width:112px; height:100%; min-height:112px;
    display:flex; align-items:center; justify-content:center;
    background:
      repeating-linear-gradient(135deg, var(--paper-dim), var(--paper-dim) 8px, #EAE1CB 8px, #EAE1CB 16px);
  }
  .produto-img-placeholder span{
    font-family:'Fraunces',serif; font-style:italic; color:var(--ink-soft);
    font-size:12px; opacity:0.7; transform:rotate(-8deg);
  }

  .produto-body{
    flex:1; padding:14px 14px 12px; display:flex; flex-direction:column;
    min-width:0;
  }
  .produto-nome{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:16.5px;
    margin-bottom:3px;
    line-height:1.25;
  }
  .produto-desc{
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.4;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .produto-footer{
    margin-top:auto;
    padding-top:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .produto-preco{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:15px;
    color:var(--stamp);
  }
  .produto-add{
    width:32px; height:32px;
    border-radius:50%;
    border:1.5px solid var(--stamp);
    color:var(--stamp);
    background:transparent;
    font-size:18px;
    line-height:1;
    cursor:pointer;
    flex:0 0 auto;
  }
  .produto-add:active{ transform:scale(0.92); }

  .qty-control{
    display:flex; align-items:center; gap:10px;
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    background:var(--paper-dim);
    border-radius:999px;
    padding:3px 4px;
  }
  .qty-control button{
    width:26px; height:26px;
    border-radius:50%;
    border:1.5px solid var(--stamp);
    color:var(--stamp);
    background:#fff;
    font-size:15px;
    cursor:pointer;
  }

  /* CARRINHO - estilo ticket térmico */
  .cart-tab{
    position:fixed; left:0; right:0; bottom:0;
    max-width:640px; margin:0 auto;
    background:var(--stamp);
    color:var(--paper);
    padding:16px 20px;
    display:flex; justify-content:space-between; align-items:center;
    border-radius:14px 14px 0 0;
    cursor:pointer;
    box-shadow:0 -6px 20px rgba(0,0,0,0.35);
  }
  .cart-tab.hidden{ display:none; }
  .cart-tab-left{ font-family:'IBM Plex Mono',monospace; font-size:14px; }
  .cart-tab-count{ font-weight:700; }
  .cart-tab-total{ font-family:'Fraunces',serif; font-weight:700; font-size:19px; }

  .drawer-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.55);
    display:none; z-index:20;
  }
  .drawer-overlay.open{ display:block; }

  .receipt{
    position:fixed; left:0; right:0; bottom:0;
    max-width:640px; margin:0 auto;
    background:var(--paper);
    z-index:21;
    transform:translateY(100%);
    transition:transform 0.28s ease;
    max-height:82vh;
    display:flex; flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom, 0);
  }
  .receipt.open{ transform:translateY(0); }
  .receipt-serrated{
    height:12px;
    background:
      radial-gradient(circle at 8px 0, transparent 8px, var(--paper) 8.5px) repeat-x;
    background-size:16px 12px;
  }
  .receipt-head{
    font-family:'IBM Plex Mono',monospace;
    text-align:center;
    padding:6px 20px 10px;
    border-bottom:2px dashed var(--line);
  }
  .receipt-head .t1{ font-weight:700; letter-spacing:2px; font-size:13px; }
  .receipt-head .t2{ font-size:11.5px; color:var(--ink-soft); margin-top:3px; }

  .receipt-items{ overflow-y:auto; padding:12px 20px; flex:1; }
  .receipt-item{
    display:flex; justify-content:space-between; gap:10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:13.5px;
    padding:9px 0;
    border-bottom:1px dotted var(--line);
  }
  .receipt-item-name{ flex:1; }
  .receipt-item-obs{
    font-family:'Inter',sans-serif;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:3px;
  }
  .receipt-item-obs input{
    width:100%;
    font-family:'Inter',sans-serif;
    font-size:12px;
    border:1px solid var(--line);
    border-radius:6px;
    padding:5px 8px;
    margin-top:4px;
    background:#fff;
  }
  .receipt-remove{
    background:none; border:none; color:var(--ink-soft);
    font-size:12px; text-decoration:underline; cursor:pointer;
    margin-top:4px;
  }

  .receipt-empty{
    text-align:center; padding:40px 20px; color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace; font-size:13px;
  }

  .receipt-total{
    display:flex; justify-content:space-between;
    font-family:'IBM Plex Mono',monospace;
    font-weight:700; font-size:16px;
    padding:14px 20px 4px;
    border-top:2px dashed var(--line);
  }

  .receipt-footer{ padding:14px 20px 18px; }
  .btn-send{
    width:100%;
    background:var(--stamp);
    color:var(--paper);
    border:none;
    padding:15px;
    border-radius:10px;
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    letter-spacing:1px;
    font-size:14px;
    cursor:pointer;
  }
  .btn-send:disabled{ opacity:0.5; }
  .btn-close-drawer{
    display:block; margin:0 auto 8px; background:none; border:none;
    color:var(--ink-soft); font-size:12px; cursor:pointer;
  }

  .toast{
    position:fixed; top:16px; left:50%; transform:translateX(-50%);
    background:var(--sage); color:var(--paper);
    padding:12px 20px; border-radius:10px;
    font-family:'IBM Plex Mono',monospace; font-size:13px;
    z-index:40; display:none;
    max-width:90%; text-align:center;
  }

  .state-msg{
    color:var(--paper); text-align:center; padding:60px 20px;
    font-family:'IBM Plex Mono',monospace; font-size:14px; line-height:1.6;
  }

  .confirm-screen{
    max-width:640px; margin:60px auto; text-align:center; padding:0 24px;
    color:var(--paper);
  }
  .confirm-screen .stamp{ margin-bottom:22px; }
  .confirm-screen p{ font-family:'IBM Plex Mono',monospace; font-size:13.5px; color:#B8B2A2; line-height:1.7; }
  .btn-outline{
    margin-top:26px;
    background:transparent; border:1.5px solid var(--paper);
    color:var(--paper); padding:12px 22px; border-radius:10px;
    font-family:'IBM Plex Mono',monospace; font-size:13px; cursor:pointer;
  }

  /* BADGE flutuante de pedido ativo */
  .pedido-ativo-badge{
    position:fixed; top:14px; left:50%; transform:translateX(-50%);
    background:var(--sage); color:var(--paper);
    padding:10px 18px; border-radius:999px; z-index:15;
    font-family:'IBM Plex Mono',monospace; font-size:12.5px;
    display:flex; align-items:center; gap:8px; cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,0.3);
    max-width:90%;
  }
  .pedido-ativo-badge .dot-pulse{
    width:7px; height:7px; border-radius:50%; background:var(--paper);
    animation:pulse 1.4s infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.3;} }

  /* TELA DE ACOMPANHAMENTO */
  .track-screen{
    max-width:520px; margin:0 auto; padding:50px 24px 40px; color:var(--paper);
  }
  .track-header{ text-align:center; margin-bottom:36px; }
  .track-header .mesa-tag{
    font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:2px; color:#B8B2A2;
  }

  .track-steps{ display:flex; flex-direction:column; gap:0; margin-bottom:32px; }
  .track-step{ display:flex; gap:14px; position:relative; padding-bottom:28px; }
  .track-step:last-child{ padding-bottom:0; }
  .track-step .connector{
    position:absolute; left:13px; top:28px; bottom:0; width:2px;
    background:#3A382F;
  }
  .track-step:last-child .connector{ display:none; }
  .track-step.done .connector{ background:var(--sage); }

  .track-dot{
    width:28px; height:28px; border-radius:50%; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    background:#242219; border:2px solid #3A382F;
    font-size:13px; z-index:1;
  }
  .track-step.done .track-dot{ background:var(--sage); border-color:var(--sage); color:var(--paper); }
  .track-step.current .track-dot{
    background:var(--stamp); border-color:var(--stamp); color:var(--paper);
    box-shadow:0 0 0 5px rgba(180,57,44,0.25);
  }

  .track-label{ padding-top:3px; }
  .track-label .titulo{
    font-family:'Fraunces',serif; font-weight:600; font-size:16px; color:#6B6558;
  }
  .track-step.done .track-label .titulo,
  .track-step.current .track-label .titulo{ color:var(--paper); }
  .track-label .desc{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:#6B6558; margin-top:2px;
  }

  .track-itens{
    background:#1F1E19; border:1px solid #37352C; border-radius:12px;
    padding:16px 18px; margin-bottom:24px;
  }
  .track-itens .item-linha{
    display:flex; justify-content:space-between;
    font-family:'IBM Plex Mono',monospace; font-size:13px;
    padding:6px 0; border-bottom:1px dotted #37352C;
  }
  .track-itens .item-linha:last-child{ border-bottom:none; }
  .track-total{
    display:flex; justify-content:space-between; font-family:'IBM Plex Mono',monospace;
    font-weight:700; font-size:14px; padding-top:8px; margin-top:6px; border-top:2px dashed #37352C;
  }
  .track-cancelado{
    text-align:center; font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--stamp);
    padding:14px; background:rgba(180,57,44,0.1); border-radius:10px; margin-bottom:20px;
  }
</style>
</head>
<body>

<div id="app">
  <div class="state-msg">Carregando cardápio…</div>
</div>

<div id="modalAdicionaisRoot"></div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   CONFIGURAÇÃO — troque pelos dados do SEU projeto Supabase
   (Supabase > Project Settings > API)
========================================================= */
const SUPABASE_URL = "https://xdcevntyknfuofktcjqh.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_ni_JrSo3MM7i5aLM9hdKOw_pl7lkZcZ";
/* ========================================================= */

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const app = document.getElementById("app");
const toastEl = document.getElementById("toast");

let categorias = [];
let produtos = [];
let cart = [];             // { produto_id, nome, preco, quantidade, observacao }
let activeCat = null;
let taxaEntrega = 0;
let logoUrl = null;
let pedidosAtivosIds = [];  // ids de TODOS os pedidos de delivery em aberto (guardado no navegador)
let telaAtual = "cardapio"; // "cardapio" | "checkout" | "acompanhamento"
let canalRealtimePedidos = null;

const CHAVE_STORAGE = "pedidos_ativos_delivery";

function lerPedidosAtivosStorage(){
  try{
    const raw = localStorage.getItem(CHAVE_STORAGE);
    return raw ? JSON.parse(raw) : [];
  } catch(e){ return []; }
}

function salvarPedidosAtivosStorage(ids){
  localStorage.setItem(CHAVE_STORAGE, JSON.stringify(ids));
}

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.style.display = "block";
  setTimeout(() => toastEl.style.display = "none", 2600);
}

function formatBRL(v){
  return v.toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
}

async function init(){
  const { data: config } = await sb.from("configuracoes").select("taxa_entrega, logo_url").eq("id", 1).maybeSingle();
  taxaEntrega = config ? Number(config.taxa_entrega) : 0;
  logoUrl = config?.logo_url || null;

  const idsSalvos = lerPedidosAtivosStorage();
  if (idsSalvos.length > 0){
    const { data: pedidosSalvos } = await sb.from("pedidos").select("id, status").in("id", idsSalvos);
    const aindaAtivos = (pedidosSalvos || []).filter(p => !["entregue", "cancelado"].includes(p.status)).map(p => p.id);
    pedidosAtivosIds = aindaAtivos;
    salvarPedidosAtivosStorage(aindaAtivos);
  }

  const [{ data: catData }, { data: prodData }] = await Promise.all([
    sb.from("categorias").select("*").order("ordem", { ascending:true }),
    sb.from("produtos").select("*, adicionais(*)").eq("disponivel", true).order("ordem", { ascending:true })
  ]);

  categorias = catData || [];
  produtos = prodData || [];
  activeCat = categorias[0]?.id || null;

  if (pedidosAtivosIds.length > 0){
    renderAcompanhamento();
  } else {
    render();
  }
}

function render(){
  telaAtual = "cardapio";
  app.innerHTML = `
    ${pedidosAtivosIds.length > 0 ? `
      <div class="pedido-ativo-badge" id="pedidoAtivoBadge">
        <span class="dot-pulse"></span> Acompanhar ${pedidosAtivosIds.length > 1 ? `meus pedidos (${pedidosAtivosIds.length})` : 'meu pedido'}
      </div>
    ` : ''}
    <div class="hero">
      ${logoUrl ? `<div class="hero-logo-frame"><img src="${logoUrl}"/></div>` : ''}
      <div class="stamp">Delivery</div>
      <div class="mesa-tag">PEÇA E RECEBA EM CASA</div>
    </div>

    <div class="cat-tabs" id="catTabs">
      ${categorias.map(c => `
        <button class="cat-tab ${c.id === activeCat ? 'active' : ''}" data-cat="${c.id}">${c.nome}</button>
      `).join('')}
    </div>

    <div class="paper-panel">
      ${categorias.filter(c => c.id === activeCat).map(cat => `
        <div class="cat-section">
          <div class="cat-title">${cat.nome}</div>
          <div class="cat-subtitle">${produtos.filter(p => p.categoria_id === cat.id).length} ${produtos.filter(p => p.categoria_id === cat.id).length === 1 ? 'item' : 'itens'}</div>
          <hr class="cat-divider"/>
        </div>
        <div class="produtos-grid">
          ${produtos.filter(p => p.categoria_id === cat.id).map(renderProduto).join('') || `
            <div style="text-align:center; padding:24px 20px 32px; color:var(--ink-soft);">
              <div style="font-size:22px; margin-bottom:8px; opacity:0.5;">🍽️</div>
              <div style="font-family:'IBM Plex Mono',monospace; font-size:12.5px;">Sem itens nesta categoria no momento.</div>
            </div>`}
        </div>
      `).join('')}
    </div>

    <div class="cart-tab ${cart.length === 0 ? 'hidden' : ''}" id="cartTab">
      <div class="cart-tab-left">
        <span class="cart-tab-count">${cartCount()}</span> item(ns)
      </div>
      <div class="cart-tab-total">${formatBRL(cartTotal() + taxaEntrega)}</div>
    </div>

    <div class="drawer-overlay" id="overlay"></div>
    <div class="receipt" id="receipt">
      <div class="receipt-serrated"></div>
      <div class="receipt-head">
        <button class="btn-close-drawer" id="closeDrawer">fechar ▾</button>
        <div class="t1">SEU PEDIDO</div>
        <div class="t2">DELIVERY</div>
      </div>
      <div class="receipt-items" id="receiptItems"></div>
      <div class="receipt-total" style="border-top:none; padding-top:4px;">
        <span>SUBTOTAL</span><span>${formatBRL(cartTotal())}</span>
      </div>
      <div class="receipt-total" style="padding-top:2px;">
        <span>TAXA DE ENTREGA</span><span>${taxaEntrega > 0 ? formatBRL(taxaEntrega) : 'Grátis'}</span>
      </div>
      <div class="receipt-total">
        <span>TOTAL</span><span>${formatBRL(cartTotal() + taxaEntrega)}</span>
      </div>
      <div class="receipt-footer">
        <button class="btn-send" id="sendBtn" ${cart.length === 0 ? 'disabled' : ''}>CONTINUAR PARA ENTREGA</button>
      </div>
    </div>
  `;

  document.querySelectorAll(".cat-tab").forEach(btn => {
    btn.addEventListener("click", () => { activeCat = btn.dataset.cat; render(); });
  });
  document.querySelectorAll(".produto-add").forEach(btn => {
    btn.addEventListener("click", () => addToCart(btn.dataset.prod));
  });
  document.querySelectorAll(".qty-btn").forEach(btn => {
    btn.addEventListener("click", () => changeQty(btn.dataset.chave, parseInt(btn.dataset.delta)));
  });

  document.getElementById("cartTab")?.addEventListener("click", openDrawer);
  document.getElementById("overlay")?.addEventListener("click", closeDrawer);
  document.getElementById("closeDrawer")?.addEventListener("click", closeDrawer);
  document.getElementById("sendBtn")?.addEventListener("click", () => { closeDrawer(); renderCheckout(); });
  document.getElementById("pedidoAtivoBadge")?.addEventListener("click", renderAcompanhamento);

  renderReceiptItems();
}

function renderProduto(p){
  const temAdicionais = p.adicionais && p.adicionais.length > 0;
  const chaveSemAdicionais = p.id + '|';
  const inCart = !temAdicionais ? cart.find(i => i.chave === chaveSemAdicionais) : null;
  return `
    <div class="produto-card ${p.imagem_url ? '' : 'sem-imagem'}">
      <div class="produto-img-wrap">
        ${p.imagem_url
          ? `<img src="${p.imagem_url}" class="produto-img" alt="${p.nome}"/>`
          : `<div class="produto-img-placeholder"><span>sem foto</span></div>`
        }
      </div>
      <div class="produto-body">
        <div class="produto-nome">${p.nome}</div>
        ${p.descricao ? `<div class="produto-desc">${p.descricao}</div>` : ''}
        <div class="produto-footer">
          <div class="produto-preco">
            ${formatBRL(Number(p.preco))}
            ${temAdicionais ? `<span style="display:block; font-size:10.5px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; font-weight:400;">+ adicionais</span>` : ''}
          </div>
          ${temAdicionais ? `
            <button class="produto-add" data-prod="${p.id}">+</button>
          ` : inCart ? `
            <div class="qty-control">
              <button class="qty-btn" data-chave="${chaveSemAdicionais}" data-delta="-1">–</button>
              <span>${inCart.quantidade}</span>
              <button class="qty-btn" data-chave="${chaveSemAdicionais}" data-delta="1">+</button>
            </div>
          ` : `
            <button class="produto-add" data-prod="${p.id}">+</button>
          `}
        </div>
      </div>
    </div>
  `;
}

let produtoModalAdicionais = null;
let selecaoAdicionaisTemp = [];

function addToCart(produtoId){
  const p = produtos.find(x => x.id === produtoId);
  if (!p) return;
  if (p.adicionais && p.adicionais.length > 0){
    produtoModalAdicionais = p;
    selecaoAdicionaisTemp = [];
    desenharModalAdicionais();
    return;
  }
  adicionarAoCarrinho(p, []);
}

function adicionarAoCarrinho(produto, adicionaisSelecionados){
  const chave = produto.id + '|' + adicionaisSelecionados.map(a => a.id).sort().join(',');
  const existing = cart.find(i => i.chave === chave);
  if (existing){
    existing.quantidade += 1;
  } else {
    const precoUnitario = Number(produto.preco) + adicionaisSelecionados.reduce((s,a) => s + Number(a.preco), 0);
    cart.push({
      chave,
      produto_id: produto.id,
      nome: produto.nome,
      adicionais: adicionaisSelecionados.map(a => ({ nome:a.nome, preco:Number(a.preco) })),
      preco: precoUnitario,
      quantidade: 1,
      observacao: ""
    });
  }
  render();
}

function desenharModalAdicionais(){
  const p = produtoModalAdicionais;
  const totalUnit = Number(p.preco) + selecaoAdicionaisTemp.reduce((s,a) => s + Number(a.preco), 0);
  const root = document.getElementById("modalAdicionaisRoot");
  root.innerHTML = `
    <div class="drawer-overlay open" id="adicionaisOverlay"></div>
    <div class="receipt open" id="adicionaisModal">
      <div class="receipt-serrated"></div>
      <div class="receipt-head">
        <button class="btn-close-drawer" id="fecharAdicionaisBtn">fechar ▾</button>
        <div class="t1">${p.nome.toUpperCase()}</div>
        <div class="t2">Escolha os adicionais</div>
      </div>
      <div class="receipt-items">
        ${p.adicionais.map(a => `
          <label style="display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px dotted var(--line); cursor:pointer;">
            <span style="display:flex; align-items:center; gap:10px; font-size:14px;">
              <input type="checkbox" data-adicional="${a.id}" ${selecaoAdicionaisTemp.find(s => s.id === a.id) ? 'checked' : ''}/>
              ${a.nome}
            </span>
            <span style="font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--stamp);">+ ${formatBRL(Number(a.preco))}</span>
          </label>
        `).join('')}
      </div>
      <div class="receipt-total">
        <span>PREÇO UNITÁRIO</span><span>${formatBRL(totalUnit)}</span>
      </div>
      <div class="receipt-footer">
        <button class="btn-send" id="confirmarAdicionaisBtn">ADICIONAR AO CARRINHO</button>
      </div>
    </div>
  `;

  root.querySelectorAll("[data-adicional]").forEach(chk => {
    chk.addEventListener("change", () => {
      const ad = p.adicionais.find(a => a.id === chk.dataset.adicional);
      if (chk.checked) selecaoAdicionaisTemp.push(ad);
      else selecaoAdicionaisTemp = selecaoAdicionaisTemp.filter(s => s.id !== ad.id);
      desenharModalAdicionais();
    });
  });
  document.getElementById("adicionaisOverlay").addEventListener("click", fecharModalAdicionais);
  document.getElementById("fecharAdicionaisBtn").addEventListener("click", fecharModalAdicionais);
  document.getElementById("confirmarAdicionaisBtn").addEventListener("click", () => {
    adicionarAoCarrinho(p, selecaoAdicionaisTemp);
    fecharModalAdicionais();
  });
}

function fecharModalAdicionais(){
  document.getElementById("modalAdicionaisRoot").innerHTML = "";
  produtoModalAdicionais = null;
}

function changeQty(chave, delta){
  const item = cart.find(i => i.chave === chave);
  if (!item) return;
  item.quantidade += delta;
  if (item.quantidade <= 0) cart = cart.filter(i => i.chave !== chave);
  render();
}

function cartCount(){ return cart.reduce((s,i) => s + i.quantidade, 0); }
function cartTotal(){ return cart.reduce((s,i) => s + i.quantidade * i.preco, 0); }

function openDrawer(){
  document.getElementById("overlay").classList.add("open");
  document.getElementById("receipt").classList.add("open");
}
function closeDrawer(){
  document.getElementById("overlay").classList.remove("open");
  document.getElementById("receipt").classList.remove("open");
}

function renderReceiptItems(){
  const el = document.getElementById("receiptItems");
  if (!el) return;
  if (cart.length === 0){
    el.innerHTML = `<div class="receipt-empty">Seu ticket está vazio.<br>Toque em "+" nos itens do cardápio.</div>`;
    return;
  }
  el.innerHTML = cart.map(i => `
    <div class="receipt-item">
      <div class="receipt-item-name">
        ${i.quantidade}x ${i.nome}
        ${(i.adicionais && i.adicionais.length > 0) ? `<div class="receipt-item-obs">+ ${i.adicionais.map(a => a.nome).join(', ')}</div>` : ''}
        <div class="receipt-item-obs">
          <input type="text" placeholder="observação (ex: sem cebola)" data-obs="${i.chave}" value="${i.observacao}"/>
        </div>
        <button class="receipt-remove" data-remove="${i.chave}">remover</button>
      </div>
      <div>${formatBRL(i.quantidade * i.preco)}</div>
    </div>
  `).join('');

  el.querySelectorAll("[data-obs]").forEach(inp => {
    inp.addEventListener("input", () => {
      const item = cart.find(i => i.chave === inp.dataset.obs);
      if (item) item.observacao = inp.value;
    });
  });
  el.querySelectorAll("[data-remove]").forEach(btn => {
    btn.addEventListener("click", () => {
      cart = cart.filter(i => i.chave !== btn.dataset.remove);
      render();
      openDrawer();
    });
  });
}

let checkoutData = { nome:"", telefone:"", endereco:"", forma_pagamento:"", troco_para:"" };

function renderCheckout(){
  telaAtual = "checkout";
  app.innerHTML = `
    <div class="track-screen" style="padding-top:36px;">
      <div class="track-header">
        ${logoUrl ? `<div class="track-logo-frame"><img src="${logoUrl}"/></div>` : ''}
        <div class="stamp">Finalizar pedido</div>
      </div>

      <div class="track-itens" style="margin-bottom:18px;">
        <label style="display:block; font-family:'IBM Plex Mono',monospace; font-size:11px; color:#8B8574; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px;">Seu nome</label>
        <input type="text" id="ckNome" value="${checkoutData.nome}" placeholder="Ex: Maria Silva" style="width:100%; padding:11px 12px; border-radius:8px; border:1px solid #37352C; background:#14140F; color:var(--paper); font-family:'Inter',sans-serif; font-size:14px; margin-bottom:14px;"/>

        <label style="display:block; font-family:'IBM Plex Mono',monospace; font-size:11px; color:#8B8574; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px;">Telefone / WhatsApp</label>
        <input type="tel" id="ckTelefone" value="${checkoutData.telefone}" placeholder="(00) 00000-0000" style="width:100%; padding:11px 12px; border-radius:8px; border:1px solid #37352C; background:#14140F; color:var(--paper); font-family:'Inter',sans-serif; font-size:14px; margin-bottom:14px;"/>

        <label style="display:block; font-family:'IBM Plex Mono',monospace; font-size:11px; color:#8B8574; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px;">Endereço de entrega completo</label>
        <textarea id="ckEndereco" placeholder="Rua, número, bairro, complemento, ponto de referência..." rows="3" style="width:100%; padding:11px 12px; border-radius:8px; border:1px solid #37352C; background:#14140F; color:var(--paper); font-family:'Inter',sans-serif; font-size:14px; resize:none;">${checkoutData.endereco}</textarea>
      </div>

      <div class="track-itens" style="margin-bottom:18px;">
        <label style="display:block; font-family:'IBM Plex Mono',monospace; font-size:11px; color:#8B8574; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:10px;">Forma de pagamento</label>
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;">
          ${[['dinheiro','Dinheiro'],['cartao','Cartão'],['pix','Pix']].map(([valor, label]) => `
            <button type="button" data-pagamento="${valor}" class="pagamento-opcao" style="flex:1; min-width:90px; padding:11px; border-radius:8px; border:1.5px solid ${checkoutData.forma_pagamento === valor ? 'var(--stamp)' : '#37352C'}; background:${checkoutData.forma_pagamento === valor ? 'rgba(180,57,44,0.15)' : '#14140F'}; color:var(--paper); font-family:'IBM Plex Mono',monospace; font-size:12.5px; cursor:pointer;">${label}</button>
          `).join('')}
        </div>
        <div id="trocoWrap" style="${checkoutData.forma_pagamento === 'dinheiro' ? '' : 'display:none;'}">
          <label style="display:block; font-family:'IBM Plex Mono',monospace; font-size:11px; color:#8B8574; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px;">Troco para quanto? (opcional)</label>
          <input type="number" step="0.01" id="ckTroco" value="${checkoutData.troco_para}" placeholder="Ex: 50" style="width:100%; padding:11px 12px; border-radius:8px; border:1px solid #37352C; background:#14140F; color:var(--paper); font-family:'Inter',sans-serif; font-size:14px;"/>
        </div>
      </div>

      <div class="track-itens" style="margin-bottom:24px;">
        <div class="item-linha"><span>Subtotal</span><span>${formatBRL(cartTotal())}</span></div>
        <div class="item-linha"><span>Taxa de entrega</span><span>${taxaEntrega > 0 ? formatBRL(taxaEntrega) : 'Grátis'}</span></div>
        <div class="track-total"><span>TOTAL</span><span>${formatBRL(cartTotal() + taxaEntrega)}</span></div>
      </div>

      <button class="btn-send" id="confirmarPedidoBtn" style="width:100%;">CONFIRMAR PEDIDO</button>
      <button class="btn-outline" id="voltarCarrinhoBtn" style="width:100%;">Voltar ao carrinho</button>
    </div>
  `;

  document.querySelectorAll("[data-pagamento]").forEach(btn => {

      checkoutData.endereco = document.getElementById("ckEndereco").value;

      renderCheckout();
    });
  });

  document.getElementById("voltarCarrinhoBtn").addEventListener("click", () => { render(); openDrawer(); });
  document.getElementById("confirmarPedidoBtn").addEventListener("click", enviarPedido);

async function enviarPedido(){
  if (cart.length === 0) return;

  const nome = document.getElementById("ckNome").value.trim();
  const telefone = document.getElementById("ckTelefone").value.trim();
  const endereco = document.getElementById("ckEndereco").value.trim();
  const formaPagamento = checkoutData.forma_pagamento;
  const trocoPara = document.getElementById("ckTroco")?.value || "";

  if (!nome) return showToast("Digite seu nome.");
  if (!endereco) return showToast("Digite o endereço de entrega.");
  if (!formaPagamento) return showToast("Escolha a forma de pagamento.");

  const btn = document.getElementById("confirmarPedidoBtn");
  btn.disabled = true;
  btn.textContent = "ENVIANDO...";

  try{
    const { data: pedido, error: pedidoErr } = await sb
      .from("pedidos")
      .insert({
        tipo: "delivery",
        mesa_id: null,
        nome_cliente: nome,
        telefone_cliente: telefone || null,
        endereco,
        forma_pagamento: formaPagamento,
        troco_para: (formaPagamento === "dinheiro" && trocoPara) ? parseFloat(trocoPara) : null,
        taxa_entrega: taxaEntrega,
        total: cartTotal() + taxaEntrega,
        status: "novo"
      })
      .select()
      .single();

    if (pedidoErr) throw pedidoErr;

    const itens = cart.map(i => ({
      pedido_id: pedido.id,
      produto_id: i.produto_id,
      nome_produto: i.nome,
      quantidade: i.quantidade,
      preco_unitario: i.preco,
      observacao: i.observacao || null,
      adicionais: i.adicionais || []
    }));

    const { error: itensErr } = await sb.from("itens_pedido").insert(itens);
    if (itensErr) throw itensErr;

    cart = [];
    checkoutData = { nome:"", telefone:"", endereco:"", forma_pagamento:"", troco_para:"" };
    pedidosAtivosIds = [...pedidosAtivosIds, pedido.id];
    salvarPedidosAtivosStorage(pedidosAtivosIds);
    renderAcompanhamento();
  } catch(err){
    console.error(err);
    showToast("Não foi possível enviar o pedido. Tente novamente.");
    btn.disabled = false;
    btn.textContent = "CONFIRMAR PEDIDO";
  }
}

const ETAPAS = [
  { status: "novo", titulo: "Pedido recebido", desc: "Seu pedido chegou na cozinha" },
  { status: "preparando", titulo: "Em preparo", desc: "Seu pedido está sendo feito" },
  { status: "pronto", titulo: "Saiu para entrega", desc: "Já está a caminho!" },
  { status: "entregue", titulo: "Entregue", desc: "Bom apetite!" }
];


let pedidosAcompanhamento = []; // dados completos dos pedidos ativos, para re-render em tempo real

async function renderAcompanhamento(){
  telaAtual = "acompanhamento";
  if (canalRealtimePedidos){ sb.removeChannel(canalRealtimePedidos); canalRealtimePedidos = null; }

  if (pedidosAtivosIds.length === 0){ render(); return; }

  const { data, error } = await sb
    .from("pedidos")
    .select("*, itens_pedido(*)")
    .in("id", pedidosAtivosIds)
    .order("created_at", { ascending:true });

  if (error){
    showToast("Não foi possível carregar seus pedidos.");
    render();
    return;
  }

  // remove da lista qualquer pedido que já não existe mais / já foi entregue-cancelado
  pedidosAcompanhamento = (data || []).filter(p => !["entregue", "cancelado"].includes(p.status));
  const idsAindaAtivos = pedidosAcompanhamento.map(p => p.id);
  if (idsAindaAtivos.length !== pedidosAtivosIds.length){
    pedidosAtivosIds = idsAindaAtivos;
    salvarPedidosAtivosStorage(pedidosAtivosIds);
  }

  if (pedidosAcompanhamento.length === 0){ render(); return; }

  desenharAcompanhamento();

  canalRealtimePedidos = sb.channel(`pedidos-delivery-${pedidosAtivosIds.join('-')}`)
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "pedidos" }, (payload) => {
      if (!pedidosAtivosIds.includes(payload.new.id)) return;

      if (["entregue", "cancelado"].includes(payload.new.status)){
        pedidosAtivosIds = pedidosAtivosIds.filter(id => id !== payload.new.id);
        salvarPedidosAtivosStorage(pedidosAtivosIds);
        pedidosAcompanhamento = pedidosAcompanhamento.filter(p => p.id !== payload.new.id);
      } else {
        pedidosAcompanhamento = pedidosAcompanhamento.map(p => p.id === payload.new.id ? { ...p, ...payload.new } : p);
      }

      if (pedidosAcompanhamento.length === 0){ render(); return; }
      desenharAcompanhamento();
    })
    .subscribe();
}

function desenharAcompanhamento(){
  app.innerHTML = `
    <div class="track-screen">
      <div class="track-header">
        ${logoUrl ? `<div class="track-logo-frame"><img src="${logoUrl}"/></div>` : ''}
        <div class="stamp">Seu${pedidosAcompanhamento.length > 1 ? 's pedidos' : ' pedido'}</div>
        <div class="mesa-tag" style="margin-top:14px;">DELIVERY</div>
      </div>

      ${pedidosAcompanhamento.map(pedido => desenharCardPedido(pedido)).join('')}

      <button class="btn-outline" id="voltarCardapioBtn" style="width:100%;">Ver cardápio / fazer outro pedido</button>
    </div>
  `;

  document.getElementById("voltarCardapioBtn").addEventListener("click", render);
}

function desenharCardPedido(pedido){
  const cancelado = pedido.status === "cancelado";
  const etapaAtualIndex = ETAPAS.findIndex(e => e.status === pedido.status);
  const horaPedido = new Date(pedido.created_at).toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });

  return `
    <div style="margin-bottom:34px; padding-bottom:30px; border-bottom:1px dashed #37352C;">
      <div style="font-family:'IBM Plex Mono',monospace; font-size:11px; color:#8B8574; margin-bottom:16px; text-align:center;">
        PEDIDO FEITO ÀS ${horaPedido}
      </div>

      ${cancelado ? `
        <div class="track-cancelado">Este pedido foi cancelado. Fale com um atendente se tiver dúvidas.</div>
      ` : `
        <div class="track-steps">
          ${ETAPAS.map((etapa, i) => {
            const done = i < etapaAtualIndex;
            const current = i === etapaAtualIndex;
            return `
              <div class="track-step ${done ? 'done' : ''} ${current ? 'current' : ''}">
                <div class="connector"></div>
                <div class="track-dot">${done ? '✓' : (i + 1)}</div>
                <div class="track-label">
                  <div class="titulo">${etapa.titulo}</div>
                  <div class="desc">${etapa.desc}</div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `}

      <div class="track-itens">
        ${(pedido.itens_pedido || []).map(i => `
          <div class="item-linha">
            <span>${i.quantidade}x ${i.nome_produto}${(i.adicionais && i.adicionais.length > 0) ? `<br/><span style="font-size:11px; opacity:0.7;">+ ${i.adicionais.map(a => a.nome).join(', ')}</span>` : ''}</span>
            <span>${formatBRL(i.quantidade * i.preco_unitario)}</span>
          </div>
        `).join('')}
        <div class="track-total"><span>TOTAL</span><span>${formatBRL(pedido.total)}</span></div>
      </div>
    </div>
  `;
}

init();
</script>
