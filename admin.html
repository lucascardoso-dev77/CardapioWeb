      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )

              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);

    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }

      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }

      _modules[_moduleCount - 8][8] = (!test);
    };

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              if (byteIndex < data.length) {

              var mask = maskFunc(row, col - c);

        maxEcCount = Math.max(maxEcCount, ecCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {

      for (var i = 0; i < rsBlocks.length; i += 1) {

      for (var i = 0; i < maxDcCount; i += 1) {

            index += 1;

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {

            data[index] = ecdata[r][i];
            index += 1;
          }

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];

        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);

      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw new Error('code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')');

      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw new Error(row + ',' + col);
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;
        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();
          for (var i = 0; i < _dataList.length; i += 1) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }
          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i += 1) {
            totalDataCount += rsBlocks[i].dataCount;
          }
          if (buffer.getLengthInBits() <= totalDataCount * 8) {

      }

      qrSvg += '<svg';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '"';
      qrSvg += ' xmlns="http://www.w3.org/2000/svg"';
      qrSvg += '>';
      qrSvg += '<rect width="100%" height="100%" fill="white"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;

      qrSvg += '</svg>';

      return qrSvg;
    };

    return _this;

    var bytes = new Array();

    return bytes;
  };

    M : 0,
    Q : 3,
    H : 2

  var QRMaskPattern = {

    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7

      [6, 18],
      [6, 22],
      [6, 26],
      [6, 30],
      [6, 34],
      [6, 22, 38],
      [6, 24, 42],
      [6, 26, 46],
      [6, 28, 50],
      [6, 30, 54],
      [6, 32, 58],
      [6, 34, 62],
      [6, 26, 46, 66],
      [6, 26, 48, 70],
      [6, 26, 50, 74],
      [6, 30, 54, 78],
      [6, 30, 56, 82],
      [6, 30, 58, 86],
      [6, 34, 62, 90],
      [6, 28, 50, 72, 94],
      [6, 26, 50, 74, 98],
      [6, 30, 54, 78, 102],
      [6, 28, 54, 80, 106],
      [6, 32, 58, 84, 110],
      [6, 30, 58, 86, 114],
      [6, 34, 62, 90, 118],
      [6, 26, 50, 74, 98, 122],
      [6, 30, 54, 78, 102, 126],
      [6, 26, 52, 78, 104, 130],
      [6, 30, 56, 82, 108, 134],
      [6, 34, 60, 86, 112, 138],
      [6, 30, 58, 86, 114, 142],
      [6, 34, 62, 90, 118, 146],
      [6, 30, 54, 78, 102, 126, 150],
      [6, 24, 50, 76, 102, 128, 154],
      [6, 28, 54, 80, 106, 132, 158],
      [6, 32, 58, 84, 110, 136, 162],
      [6, 26, 54, 82, 110, 138, 166],

    var G18 = (1 << 12) | (1 << 11) | (1 << 10) | (1 << 9) | (1 << 8) | (1 << 5) | (1 << 2) | (1 << 0);

    var _this = {};

    var getBCHDigit = function(data) {

      case QRMaskPattern.PATTERN010 :

      case QRMaskPattern.PATTERN011 :

      case QRMaskPattern.PATTERN101 :

      case QRMaskPattern.PATTERN110 :

        case QRMode.MODE_8BIT_BYTE : return 8;
        case QRMode.MODE_KANJI     : return 8;

          throw new Error('mode:' + mode);

        switch(mode) {
        case QRMode.MODE_NUMBER    : return 12;
        case QRMode.MODE_ALPHA_NUM : return 11;
        case QRMode.MODE_8BIT_BYTE : return 16;
        case QRMode.MODE_KANJI     : return 10;
        default :
          throw new Error('mode:' + mode);

      } else if (type < 41) {

        switch(mode) {
        case QRMode.MODE_NUMBER    : return 14;
        case QRMode.MODE_ALPHA_NUM : return 13;
        case QRMode.MODE_8BIT_BYTE : return 16;
        case QRMode.MODE_KANJI     : return 12;
        default :
          throw new Error('mode:' + mode);
        }

        throw new Error('type:' + type);
      }

          var sameCount = 0;

          for (var r = -1; r <= 1; r += 1) {

            if (row + r < 0 || moduleCount <= row + r) {

            for (var c = -1; c <= 1; c += 1) {

              if (col + c < 0 || moduleCount <= col + c) {
                continue;
              }

              if (r == 0 && c == 0) {
                continue;

              if (dark == qrcode.isDark(row + r, col + c) ) {

          if (qrcode.isDark(row, col) ) count += 1;
          if (qrcode.isDark(row + 1, col) ) count += 1;
          if (qrcode.isDark(row, col + 1) ) count += 1;
          if (qrcode.isDark(row + 1, col + 1) ) count += 1;

              &&  qrcode.isDark(row, col + 3)
              &&  qrcode.isDark(row, col + 4)
              && !qrcode.isDark(row, col + 5)

              &&  qrcode.isDark(row + 2, col)
              &&  qrcode.isDark(row + 3, col)
              &&  qrcode.isDark(row + 4, col)

              &&  qrcode.isDark(row + 6, col) ) {

      for (var col = 0; col < moduleCount; col += 1) {

    };

async function doLogin(){

  const { error } = await sb.auth.signInWithPassword({ email, password: senha });

  init();
}

async function checkSession(){
  const { data } = await sb.auth.getSession();
  if (data.session) init(); else renderLogin();
}

/* ---------------- CARREGAR DADOS ---------------- */
async function carregarDados(){
  const [{ data: catData }, { data: prodData }, { data: mesaData }, { data: configData }] = await Promise.all([
    sb.from("categorias").select("*").order("ordem", { ascending:true }),
    sb.from("produtos").select("*, categorias(nome), adicionais(*)").order("ordem", { ascending:true }),
    sb.from("mesas").select("*").order("numero", { ascending:true }),
    sb.from("configuracoes").select("*").eq("id", 1).maybeSingle()
  ]);
  categorias = catData || [];
  produtos = prodData || [];
  mesas = mesaData || [];
  configuracoes = configData || { taxa_entrega: 0 };
}

  render();
}

function comprimirImagem(file, maxDimensao = 900, qualidade = 0.8, formato = 'image/jpeg'){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);

    img.onload = () => {
      let { width, height } = img;

      if (width > maxDimensao || height > maxDimensao){
        if (width > height){
          height = Math.round(height * (maxDimensao / width));
          width = maxDimensao;
        } else {
          width = Math.round(width * (maxDimensao / height));
          height = maxDimensao;
        }
      }

      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);

      canvas.toBlob((blob) => {
        URL.revokeObjectURL(url);
        if (blob) resolve(blob); else reject(new Error('Falha ao comprimir imagem'));
      }, formato, qualidade);
    };

    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Não foi possível ler a imagem')); };
    img.src = url;
  });
}

async function uploadImagemProduto(file){
  let arquivoParaEnviar = file;
  try {
    arquivoParaEnviar = await comprimirImagem(file, 900, 0.8); // produtos: até 900px, ótimo pra thumbnails
  } catch (e) {
    console.warn('Não foi possível comprimir a imagem, enviando original:', e);
  }

  const nomeArquivo = `${Date.now()}-${Math.random().toString(36).slice(2)}.jpg`;
  const { error: uploadError } = await sb.storage.from('produtos').upload(nomeArquivo, arquivoParaEnviar, { upsert: false, contentType: 'image/jpeg' });
  if (uploadError){ alert("Erro ao enviar imagem: " + uploadError.message); return null; }
  const { data } = sb.storage.from('produtos').getPublicUrl(nomeArquivo);
  return data.publicUrl;
}

async function salvarProduto(){
  const nome = document.getElementById("prodNome").value.trim();
  const categoria_id = document.getElementById("prodCategoria").value;
  const descricao = document.getElementById("prodDesc").value.trim();
  const preco = parseFloat(document.getElementById("prodPreco").value);
  const ordem = parseInt(document.getElementById("prodOrdem").value) || 0;
  const disponivel = document.getElementById("prodDisponivel").checked;

  if (!nome) return alert("Digite o nome do produto.");
  if (isNaN(preco) || preco < 0) return alert("Digite um preço válido.");

  const btn = document.getElementById("salvarProdBtn");
  btn.disabled = true;
  const textoOriginal = btn.textContent;

  let imagem_url = editandoProdutoId ? (produtos.find(p => p.id === editandoProdutoId)?.imagem_url || null) : null;
  if (arquivoImagemSelecionado){
    btn.textContent = "Enviando imagem...";
    const url = await uploadImagemProduto(arquivoImagemSelecionado);
    if (url) imagem_url = url;
  }

  const payload = { nome, categoria_id, descricao, preco, ordem, disponivel, imagem_url };
  btn.textContent = "Salvando...";

  if (editandoProdutoId){
    const { error } = await sb.from("produtos").update(payload).eq("id", editandoProdutoId);
    if (error){ btn.disabled = false; btn.textContent = textoOriginal; return alert("Erro ao salvar: " + error.message); }
  } else {
    const { error } = await sb.from("produtos").insert(payload);
    if (error){ btn.disabled = false; btn.textContent = textoOriginal; return alert("Erro ao adicionar: " + error.message); }
  }
  editandoProdutoId = null;
  arquivoImagemSelecionado = null;
  await carregarDados();
  renderProdutos();
}

function mostrarQrMesa(numero){
  const url = `${window.location.origin}/mesa/${numero}`;
  document.getElementById("qrModalTitulo").textContent = `MESA ${String(numero).padStart(2,'0')}`;
  document.getElementById("qrModalLink").textContent = url;
  document.getElementById("qrModalOverlay").classList.add("open");

  const wrap = document.getElementById("qrModalCanvas");
  const btnBaixar = document.getElementById("qrModalBaixar");

  try {
    const qr = qrcode(0, 'M');
    qr.addData(url);
    qr.make();
    const svgMarkup = qr.createSvgTag(6, 8);
    wrap.innerHTML = svgMarkup;
    wrap.querySelector("svg").style.width = "200px";
    wrap.querySelector("svg").style.height = "200px";

    btnBaixar.style.display = "";
    btnBaixar.onclick = () => {
      const svgEl = wrap.querySelector("svg");
      const svgData = new XMLSerializer().serializeToString(svgEl);
      const svgBlob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
      const svgUrl = URL.createObjectURL(svgBlob);

      const img = new Image();
      img.onload = () => {
        const canvasTemp = document.createElement("canvas");
        canvasTemp.width = 500; canvasTemp.height = 500;
        const ctx = canvasTemp.getContext("2d");
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, 500, 500);
        ctx.drawImage(img, 0, 0, 500, 500);
        const link = document.createElement("a");
        link.download = `qr-mesa-${numero}.png`;
        link.href = canvasTemp.toDataURL("image/png");
        link.click();
        URL.revokeObjectURL(svgUrl);
      };
      img.src = svgUrl;
    };
  } catch (erro){
    console.error("Erro ao gerar QR Code:", erro);
    wrap.innerHTML = `<div style="color:var(--stamp); font-family:'IBM Plex Mono',monospace; font-size:12px; padding:20px 0;">Erro ao gerar QR Code: ${erro.message}</div>`;
    btnBaixar.style.display = "none";
  }
}

    if (error) return alert("Erro ao salvar: " + error.message);
  } else {
    const { error } = await sb.from("mesas").insert({ numero, ativa });
    if (error) return alert("Erro ao adicionar (número já existe?): " + error.message);
  }
  editandoMesaId = null;
  await carregarDados();
  renderMesas();
}

async function excluirMesa(id){
  if (!confirm("Excluir esta mesa? Pedidos antigos dela continuam salvos.")) return;
  const { error } = await sb.from("mesas").delete().eq("id", id);
  if (error) return alert("Erro ao excluir: " + error.message);
  await carregarDados();
  renderMesas();
}

      </div>
      <div class="form-actions">

    <div class="form-card">

async function salvarPix(){
  const chave = document.getElementById("chavePixInput").value.trim();
  const whatsapp = document.getElementById("whatsappComprovanteInput").value.trim().replace(/\D/g, "");
  const btn = document.getElementById("salvarPixBtn");
  btn.disabled = true;
  btn.textContent = "Salvando...";

  const { error } = await sb.from("configuracoes").update({
    chave_pix: chave || null,
    whatsapp_comprovante: whatsapp || null,
    updated_at: new Date().toISOString()
  }).eq("id", 1);

  if (error){
    alert("Erro ao salvar: " + error.message);
    btn.disabled = false;
    btn.textContent = "Salvar dados do Pix";
    return;
  }

  await carregarDados();
  renderDelivery();
}

async function salvarEnderecoLoja(){
  const endereco = document.getElementById("enderecoLojaInput").value.trim();
  const btn = document.getElementById("salvarEnderecoBtn");
  btn.disabled = true;
  btn.textContent = "Salvando...";

  const { error } = await sb.from("configuracoes").update({ endereco_loja: endereco || null, updated_at: new Date().toISOString() }).eq("id", 1);

  if (error){
    alert("Erro ao salvar: " + error.message);
    btn.disabled = false;
    btn.textContent = "Salvar endereço";
    return;
  }

  await carregarDados();
  renderDelivery();
}

async function salvarCapa(){
  const arquivo = document.getElementById("capaInput").files[0];
  if (!arquivo) return alert("Escolha uma imagem primeiro.");

  const btn = document.getElementById("salvarCapaBtn");
  btn.disabled = true;
  btn.textContent = "Enviando...";

  let arquivoParaEnviar = arquivo;
  try {
    arquivoParaEnviar = await comprimirImagem(arquivo, 1600, 0.82); // capa: banner largo, permite mais resolução
  } catch (e) {
    console.warn('Não foi possível comprimir a capa, enviando original:', e);
  }

  const nomeArquivo = `capa.jpg`;

  const { error: uploadError } = await sb.storage.from('loja').upload(nomeArquivo, arquivoParaEnviar, { upsert: true, contentType: 'image/jpeg' });
  if (uploadError){
    alert("Erro ao enviar imagem: " + uploadError.message);
    btn.disabled = false;
    btn.textContent = "Salvar foto de capa";
    return;
  }

  const { data: urlData } = sb.storage.from('loja').getPublicUrl(nomeArquivo);
  const capaUrlComVersao = `${urlData.publicUrl}?v=${Date.now()}`;

  const { error } = await sb.from("configuracoes").update({ capa_url: capaUrlComVersao, updated_at: new Date().toISOString() }).eq("id", 1);
  if (error){
    alert("Erro ao salvar: " + error.message);
    btn.disabled = false;
    btn.textContent = "Salvar foto de capa";
    return;
  }

  await carregarDados();
  renderDelivery();
}

async function removerCapa(){
  if (!confirm("Remover a foto de capa atual?")) return;
  const { error } = await sb.from("configuracoes").update({ capa_url: null, updated_at: new Date().toISOString() }).eq("id", 1);
  if (error) return alert("Erro ao remover: " + error.message);
  await carregarDados();
  renderDelivery();
}

async function salvarLogo(){
  const arquivo = document.getElementById("logoInput").files[0];
  if (!arquivo) return alert("Escolha uma imagem primeiro.");

  const btn = document.getElementById("salvarLogoBtn");
  btn.disabled = true;
  btn.textContent = "Enviando...";

  let arquivoParaEnviar = arquivo;
  try {
    arquivoParaEnviar = await comprimirImagem(arquivo, 400, 0.9, 'image/png'); // logo: PNG preserva fundo transparente
  } catch (e) {
    console.warn('Não foi possível comprimir a logo, enviando original:', e);
  }

  const nomeArquivo = `logo.png`;

  const { error: uploadError } = await sb.storage.from('loja').upload(nomeArquivo, arquivoParaEnviar, { upsert: true, contentType: 'image/png' });
  if (uploadError){
    alert("Erro ao enviar imagem: " + uploadError.message);
    btn.disabled = false;
    btn.textContent = "Salvar logo";
    return;
  }

  const { data: urlData } = sb.storage.from('loja').getPublicUrl(nomeArquivo);
  // adiciona um parâmetro pra evitar cache antigo da imagem no navegador
  const logoUrlComVersao = `${urlData.publicUrl}?v=${Date.now()}`;

  const { error } = await sb.from("configuracoes").update({ logo_url: logoUrlComVersao, updated_at: new Date().toISOString() }).eq("id", 1);
  if (error){
    alert("Erro ao salvar: " + error.message);
    btn.disabled = false;
    btn.textContent = "Salvar logo";
    return;
  }

  await carregarDados();
  renderDelivery();
}

async function removerLogo(){
  if (!confirm("Remover a logo atual?")) return;
  const { error } = await sb.from("configuracoes").update({ logo_url: null, updated_at: new Date().toISOString() }).eq("id", 1);
  if (error) return alert("Erro ao remover: " + error.message);
  await carregarDados();
  renderDelivery();
}

async function salvarTaxaEntrega(){
  const valor = parseFloat(document.getElementById("taxaEntregaInput").value);
  if (isNaN(valor) || valor < 0) return alert("Digite um valor válido.");

  const btn = document.getElementById("salvarTaxaBtn");
  btn.disabled = true;
  btn.textContent = "Salvando...";

  const { error } = await sb.from("configuracoes").update({ taxa_entrega: valor, updated_at: new Date().toISOString() }).eq("id", 1);

  if (error){
    alert("Erro ao salvar: " + error.message);
    btn.disabled = false;
    btn.textContent = "Salvar taxa de entrega";
    return;
  }

  await carregarDados();
  renderDelivery();
  alert("Taxa de entrega atualizada!");
}

async function carregarConfiguracoesPublicas(){
  const { data } = await sb.from("configuracoes").select("*").eq("id", 1).maybeSingle();
  if (data) configuracoes = data;
}

verificarLicenca().then(ok => { if (ok) carregarConfiguracoesPublicas().then(checkSession); });
